[program:ofuq-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/ofuq/back/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/www/wwwroot/ofuq/back/storage/logs/queue-worker.log
stopwaitsecs=3600

; ملاحظات:
; - numprocs=2 يعني تشغيل عاملين (workers) في نفس الوقت
; - max-time=3600 يعني إعادة تشغيل العامل كل ساعة (لتجنب تسرب الذاكرة)
; - tries=3 يعني إعادة المحاولة 3 مرات عند الفشل
; - sleep=3 يعني الانتظار 3 ثواني بين كل فحص للمهام

; لتثبيت هذا الملف:
; 1. sudo cp ofuq-queue-worker.conf /etc/supervisor/conf.d/
; 2. sudo supervisorctl reread
; 3. sudo supervisorctl update
; 4. sudo supervisorctl start ofuq-queue-worker:*

; للتحقق من الحالة:
; sudo supervisorctl status ofuq-queue-worker:*

; لإعادة التشغيل:
; sudo supervisorctl restart ofuq-queue-worker:*

; لإيقاف:
; sudo supervisorctl stop ofuq-queue-worker:*
